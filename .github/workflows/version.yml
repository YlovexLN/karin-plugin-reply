name: Version and Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}  # 手动发布 package.json 中的当前版本

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      needsPublish: ${{ steps.changesets.outputs.needsPublish }}
      new_version: ${{ steps.release_version.outputs.new_version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Check for changesets
        id: changesets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(ls -A .changeset/*.md 2>/dev/null | grep -v README.md)" ]; then
            echo "hasChangesets=true" >> $GITHUB_OUTPUT
            echo "needsPublish=true" >> $GITHUB_OUTPUT
            echo "✅ Found changesets"
          else
            echo "hasChangesets=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changesets found"
            # 本地已把版本提升好（如 pre exit 后）时，只要 npm 上还没有该版本就直接发布
            if npm view karin-plugin-reply@$VERSION version >/dev/null 2>&1; then
              echo "needsPublish=false" >> $GITHUB_OUTPUT
              echo "ℹ️ $VERSION 已在 npm，跳过发布"
            else
              echo "needsPublish=true" >> $GITHUB_OUTPUT
              echo "📦 $VERSION 未发布，将只执行发布"
            fi
          fi

      - name: Update version and sync to web.config.js
        id: update_version
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'true'
        run: |
          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 运行 changeset version（会自动更新 package.json 和 CHANGELOG.md）
          pnpm changeset version
          
          # 同步版本号到 web.config.js
          node scripts/sync-version.js
          
          # 检查是否有更改
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 提交版本更新
          git add .
          NEW_VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          
          # 推送更改和 tag
          git push origin main
          git push origin "v${NEW_VERSION}"
          
          echo "✅ Version updated to v${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Resolve release version
        id: release_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 version: $VERSION"

      # 版本已在本地提升好（无 changeset）时，直接发布需要先有对应 tag
      - name: Ensure release tag
        if: steps.changesets.outputs.needsPublish == 'true' && steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "ℹ️ tag v$VERSION 已存在"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "✅ 已创建 tag v$VERSION"
          fi

      - name: Publish to npm
        id: publish
        if: github.event_name == 'workflow_dispatch' || steps.changesets.outputs.needsPublish == 'true'
        run: |
          echo "🚀 Publishing to npm registry..."
          
          # 获取当前版本
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          # 检查 npm 上是否已存在该版本
          if npm view karin-plugin-reply@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "⚠️ 版本 $CURRENT_VERSION 已存在于 npm，跳过发布"
            exit 0
          fi

          # 预发布版本（如 0.0.9-beta.1）发到对应 dist-tag，避免覆盖 latest
          DIST_TAG=$(node -p "const m=require('./package.json').version.match(/-([a-zA-Z]+)/); m ? m[1] : 'latest'")
          echo "📌 dist-tag: $DIST_TAG"
          pnpm publish --no-git-checks --access public --tag "$DIST_TAG"

  release:
    name: GitHub Release
    needs: version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.needsPublish == 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须检出刚打出的 tag，否则 pack 出来的是 bump 之前的版本号
          ref: v${{ needs.version.outputs.new_version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ./RELEASE_BODY.md

      - name: Pack npm package
        run: |
          echo "📦 Packing npm package..."
          pnpm pack
          ls -la *.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.version.outputs.new_version }}
          tag_name: v${{ needs.version.outputs.new_version }}
          body_path: ./RELEASE_BODY.md
          files: |
            *.tgz
          draft: false
          prerelease: ${{ contains(needs.version.outputs.new_version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
